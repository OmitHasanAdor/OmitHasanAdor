  <title id="title">Introduction — Omit Hasan Ador</title>
  <desc id="desc">Animated introduction banner with a looping typing effect cycling through Frontend Developer, Full Stack Developer, Next.js Developer and MERN Stack Developer.</desc>
  <defs>
